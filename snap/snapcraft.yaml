name: flaresolverr-tak
title: flaresolverr-tak
summary: UnOfficial release of FlareSolverr
description: |
  **FlareSolverr is a proxy server to bypass Cloudflare and DDoS-GUARD protection.**

  * The API service is accessible by default at http://localhost:8191

  * See https://github.com/FlareSolverr/FlareSolverr for more details.

  **FlareSolverr Release**
  * Service is restarted on any condition.

  **Post install command to check if service is running well and responses:**
  
  sudo snap logs flaresolverr-tak
  
  **Information:**
  * Hosts with limited resources might need to increase timeout (Check with 90s).
  
  * This snap embeds Chromium binaries from Chromium snap as external executables cannot be called from a Snap and Ubuntu does not provides Chromium's packages ('chromium-desktop' package is a symlink to Chromium snap).
  * Thus it has quite an important size for the service it provides.
  * Thus it is limited to Chromium snap's available architectures for now, built on same core.
website: https://github.com/FlareSolverr/FlareSolverr
source-code: https://github.com/TehAppKiller/flaresolverr-tak
issues: https://github.com/TehAppKiller/flaresolverr-tak/issues
contact: mailto:tehappkiller@proton.me
donation: https://whydonate.com/en/fundraising/help-teh-devz
license: MIT
icon: icon.svg
grade: stable
confinement: strict
base: core24
adopt-info: flaresolverr
platforms:
  amd64:
  arm64:
  armhf:
   # Limited by Chromium snap releases (built on same core)

apps:
  flaresolverr:
    command: bin/run-flaresolverr.sh
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - opengl
    environment:
      PATH: $SNAP/usr/lib/chromium-browser:$PATH
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio/:$LD_LIBRARY_PATH
      
layout:
  /usr/share/X11:
    bind: $SNAP/usr/share/X11
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/bin/xkbcomp:
    symlink: $SNAP/usr/bin/xkbcomp
    
plugs:
  shared-memory:
    private: true # Requirement for multithreaded Python

parts:
  python-runtime:
    plugin: nil
    stage-packages:
      - python3
      
  # /!\ Problem if different core
  chromium: # Get Chromium binaries from Chromium snap
    plugin: nil
    source: .
    stage-snaps:
      - chromium
    prime:
      - usr/lib/chromium-browser # Keep only executable folder
    override-prime: |
    
      craftctl default
      # - Fix Files permissions
      chmod 555 usr/lib/chromium-browser/chrome-sandbox
    
  flaresolverr:
    after:
      - python-runtime
    source: .
    plugin: python
    python-requirements:
      - requirements.txt
    build-packages:
      - curl
      - git
    override-pull: |
    
      craftctl default
      
      # Get Last Source Tag version
      src_version=$(git ls-remote --tags --sort='version:refname' https://github.com/FlareSolverr/FlareSolverr.git | grep '\/v[0-9]*\.[0-9]*\.[0-9]*$' | tail -n 1 | sed 's/.*\/v//');
      echo "Source last tag: ${src_version}"
      snap_last_version=$(curl -sL -H "Snap-Device-Series: 16" "https://api.snapcraft.io/v2/snaps/info/flaresolverr-tak?architecture=${CRAFT_ARCH_BUILD_FOR}&fields=version" | sed -nre "s/^.*\"stable\"\,\"track\"\:\"latest\"\}\,\"version\"\:\"([^\"]*)\".*/\1/p");
      echo "Snap last version: ${snap_last_version}"
      snap_build_with_same_version=$(echo $snap_last_version | sed -nre "s/^($src_version.*).*/\1/p");
      # Same version ?
      if [ -z "$snap_build_with_same_version" ]
      then
        new_snap_version="${src_version}";
      else
        # Get snap build version
        snap_build=$(echo $snap_build_with_same_version | sed -nre 's/^.*-v([0-9]*).*/\1/p');
        # Already a build version ?
        if [ -z "$snap_build" ]
        then
          # init @v2
          new_snap_build="2";
        else
          # increment @v+1
          new_snap_build=$(($snap_build+1));
        fi

        new_snap_version="${src_version}-v${new_snap_build}";
      fi

      craftctl set version=$new_snap_version

      # Pull
      rm -rf $CRAFT_PART_SRC/{,.[!.],..?}*
      git clone -b v$src_version --depth=1 --recurse-submodules https://github.com/FlareSolverr/FlareSolverr.git .
      
      # Fix Chromedriver detection (avoid undetected-chromedriver_x64 to DL different version, especially for none-x64 arch)
      sed -i 's/\"\/app\/chromedriver\"/os\.getenv\(\"SNAP_USER_DATA"\)\+\"\/.local\/share\/chromedriver\"/g' src/utils.py
      sed -i 's/\"\/app\/chromedriver\"/os\.getenv\(\"SNAP_USER_DATA"\)\+\"\/.local\/share\/chromedriver\"/g' src/undetected_chromedriver/patcher.py
      
      # Build
      INST_DIR="$CRAFT_PART_INSTALL/Flaresolverr"
      mkdir -p "$INST_DIR"
      cp -a src/* $INST_DIR
      cp -a package.json $INST_DIR

  local:
    plugin: dump
    source: snap/local
    override-prime: |
    
      craftctl default
      chmod +rx $CRAFT_PRIME/bin/run-flaresolverr.sh

  deps:
    plugin: nil
    source: .
    stage-packages:
      - xvfb
      - xkb-data
      - procps
      # Required by Chrome
      - libnspr4
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libasound2t64
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libatspi2.0-0t64
      - libcairo2
      - libcups2t64
      - libnss3
      - libpango-1.0-0
      # Required by Chrome but seems working w/o them
      #- libqt5core5t64
      #- libqt5gui5t64
      #- libqt5widgets5t64
      #- libqt6core6t64
      #- libqt6gui6t64
      #- libqt6widgets6t64
      
